name: Build & Deploy LaTeX PDFs

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find and compile all LaTeX files
        run: |
          # Find all .tex files and compile them
          find . -name "*.tex" -type f | while read -r tex_file; do
            echo "Compiling $tex_file"
            dir=$(dirname "$tex_file")
            file=$(basename "$tex_file")
            
            # Use docker to run latexmk in the correct directory
            docker run --rm -v "$PWD:/workspace" -w "/workspace/$dir" \
              texlive/texlive:latest \
              latexmk -pdf -interaction=nonstopmode "$file" || echo "Failed to compile $tex_file"
          done

      - name: Prepare Pages content
        run: |
          mkdir public
          find . -name "*.pdf" -exec mv {} public/ \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
